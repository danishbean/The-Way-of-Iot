<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolusi - Profil Bisnis IoT</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root { --primary-blue: #0d6efd; --dark-footer: #1c1e21; }
        body { font-family: 'Inter', sans-serif; }
        
        /* Hero Section sesuai screenshot pertama */
        .hero-section { background-color: var(--primary-blue); color: white; padding: 60px 0; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; text-align: center; }
        
        /* Footer Dark Section sesuai Screenshot from 2026-05-14 18-26-30.png */
        .footer-dark { background-color: var(--dark-footer); color: white; padding: 60px 0 30px 0; text-align: center; border-radius: 40px 40px 0 0; margin-top: 50px; }
        
        .btn-wa { background-color: #128c7e; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
        .btn-email { background-color: transparent; color: white; border: 1px solid white; padding: 12px 25px; border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
        
        .social-links a { color: white; font-size: 1.2rem; margin: 0 10px; text-decoration: none; opacity: 0.8; }
        .social-links a:hover { opacity: 1; color: var(--primary-blue); }

        /* Google Maps Styling */
        .map-box { border-radius: 20px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Header / Nav -->
    <nav class="navbar navbar-light bg-white py-3">
        <div class="container text-center d-block">
            <h4 class="fw-bold mb-0"><span class="text-primary">TECH</span>SOLUSI</h4>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-section">
        <div class="container px-4">
            <h1 class="display-5 fw-bold">Solusi Teknologi & IoT</h1>
            <p class="mb-0">Transformasi digital melalui sistem otomasi dan kustom IoT.</p>
        </div>
    </header>

    <!-- Google Maps (Aktif) -->
    <section class="container mt-5 pt-4">
        <h3 class="text-center fw-bold mb-4">Lokasi Workshop</h3>
        <div class="map-box">
            <!-- EDIT: Ganti URL src dengan link 'Embed Map' Anda jika ingin lokasi spesifik -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.2731872144344!2d106.8246949!3d-6.2276373!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNsKwMTMnMzkuNSJTIDEwNsKwNDknMjguOSJF!5e0!3m2!1sid!2sid!4v1621000000000!5m2!1sid!2sid" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <!-- Footer Area sesuai Screenshot from 2026-05-14 18-26-30.png -->
    <footer class="footer-dark">
        <div class="container px-4">
            <h2 class="fw-bold mb-3">Mulai Proyek Anda Sekarang</h2>
            <p class="mb-5 text-secondary">Hubungi kami untuk mendapatkan penawaran sistem terbaik sesuai kebutuhan Anda.</p>
            
            <!-- Tombol Aktif -->
            <div class="d-flex justify-content-center flex-wrap gap-3 mb-5">
                <!-- GANTI NOMOR WA -->
                <a href="https://wa.me/628123456789" class="btn-wa">
                    <i class="bi bi-whatsapp"></i> WhatsApp
                </a>
                <!-- GANTI EMAIL -->
                <a href="mailto:kontak@techsolusi.com" class="btn-email">
                    <i class="bi bi-envelope"></i> Email
                </a>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1);">

            <div class="mt-4">
                <p class="small text-secondary d-inline-block me-3">&copy; 2026 TechSolusi. Link Media Sosial:</p>
                <span class="social-links">
                    <a href="https://instagram.com/username"><i class="bi bi-instagram"></i></a>
                    <a href="https://linkedin.com/in/username"><i class="bi bi-linkedin"></i></a>
                </span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
